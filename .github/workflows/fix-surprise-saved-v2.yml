name: Apply Surprise and Saved UI Fix
on:
  push:
    paths:
      - '.github/workflows/fix-surprise-saved-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace("const [surpriseSeed, setSurpriseSeed] = useState(0)", "const [surpriseIndex, setSurpriseIndex] = useState(-1)")
          old = "const surpriseMeal = useMemo(() => { if (!results.length) return null; const pool = results.slice(0, Math.min(results.length, 12)); return pool[surpriseSeed % pool.length] }, [results, surpriseSeed])"
          new = "const surprisePool = useMemo(() => results.slice(0, Math.min(results.length, 12)), [results])\n  const surpriseMeal = surprisePool.length ? surprisePool[Math.max(0, Math.min(surpriseIndex, surprisePool.length - 1))] : null"
          s = s.replace(old, new)
          old = "const surprise = () => { if (!results.length) return; setSurpriseSeed(seed => seed + 1); setSurpriseOpen(true) }"
          new = "const surprise = () => { if (!results.length) return; setSurpriseIndex(index => { const next = index < 0 ? 0 : (index + 1) % Math.min(results.length, 12); return next }); setSurpriseOpen(true) }"
          s = s.replace(old, new)
          s = s.replace("  useEffect(() => { localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites)) }, [favorites])", "  useEffect(() => { localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites)) }, [favorites])\n  useEffect(() => { setSurpriseIndex(-1) }, [preference, timeLimit, sortBy, ingredients])")
          p.write_text(s)
          css = Path('src/styles.css')
          c = css.read_text()
          c += '''\n.favorites-modal{position:relative;background:#fffdf8;border:1px solid #e5e1d8;border-radius:28px;width:min(900px,100%);max-height:88vh;overflow:auto;padding:32px;box-shadow:0 30px 90px rgba(29,33,27,.22)}.favorites-header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid #e7e3da;padding:0 48px 22px 2px}.favorites-header h2{font:700 38px/1.05 'Playfair Display',serif;letter-spacing:-.5px;margin:7px 0}.favorites-header p{font-size:13px;color:#7b7e75;margin:0}.saved-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}.saved-card{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center;background:#fff;border:1px solid #e5e1d8;border-radius:18px;padding:11px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.saved-card:hover{transform:translateY(-2px);border-color:#d3c7b1;box-shadow:0 12px 28px rgba(29,33,27,.10)}.saved-card img{width:118px;height:118px;aspect-ratio:1;object-fit:cover;border-radius:13px;display:block}.saved-card h3{font:600 19px/1.2 'Playfair Display',serif;margin:0 0 6px;color:#2b2f27}.saved-card span{display:block;color:#777a72;font-size:11px;line-height:1.5}.saved-card button{border:1px solid #ddd8cd;background:#f8f6f0;color:#65685f;border-radius:999px;padding:7px 11px;margin-top:11px;font:600 10px 'DM Sans';cursor:pointer}.saved-card button:hover{background:#ebe7de;border-color:#cfc7b8;color:#3b3f36}.surprise-modal .action-row{display:flex;gap:9px;flex-wrap:wrap}.surprise-modal .secondary{min-width:120px}.surprise-modal .favorite-action{min-width:110px}@media(max-width:760px){.favorites-modal{padding:20px;border-radius:22px}.favorites-header{padding-right:42px}.favorites-header h2{font-size:30px}.saved-grid{grid-template-columns:1fr}.saved-card{grid-template-columns:92px minmax(0,1fr)}.saved-card img{width:92px;height:92px}}\n'''
          css.write_text(c)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/styles.css
          git commit -m 'fix: make surprise cycling deterministic and polish saved screen' || true
          git push
          git rm .github/workflows/fix-surprise-saved-v2.yml
          git commit -m 'chore: remove temporary fix workflow' || true
          git push
