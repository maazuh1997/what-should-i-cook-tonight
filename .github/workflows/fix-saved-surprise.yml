name: Apply Saved and Surprise Fixes
on:
  push:
    paths:
      - '.github/workflows/fix-saved-surprise.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix UI and interactions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          s=s.replace("  const [surpriseOpen, setSurpriseOpen] = useState(false)", "  const [surpriseOpen, setSurpriseOpen] = useState(false)\n  const [surpriseSeed, setSurpriseSeed] = useState(0)")
          s=s.replace("const surpriseMeal = useMemo(() => { if (!results.length) return null; const pool = results.slice(0, Math.min(results.length, 12)); return pool[Math.floor(Math.random() * pool.length)] }, [results, surpriseOpen])", "const surpriseMeal = useMemo(() => { if (!results.length) return null; const pool = results.slice(0, Math.min(results.length, 12)); return pool[surpriseSeed % pool.length] }, [results, surpriseSeed])")
          s=s.replace("const surprise = () => { if (!results.length) return; setSurpriseOpen(true) }", "const surprise = () => { if (!results.length) return; setSurpriseSeed(seed => seed + 1); setSurpriseOpen(true) }")
          p.write_text(s)
          css=Path('src/styles.css')
          c=css.read_text()
          addition='''.favorites-modal{position:relative;background:#fffdf8;border-radius:22px;width:min(820px,100%);max-height:88vh;overflow:auto;padding:28px;box-shadow:0 25px 80px #0004}.favorites-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-right:45px}.favorites-header h2{font:700 36px 'Playfair Display',serif;margin:7px 0}.favorites-header p{margin:0;color:#74776e;font-size:13px}.saved-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px}.saved-card{display:grid;grid-template-columns:105px 1fr;gap:14px;background:#f5f2ea;border:1px solid #e3dfd5;border-radius:15px;padding:10px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}.saved-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #1d211b12}.saved-card img{width:105px;height:105px;border-radius:11px;object-fit:cover;display:block}.saved-card h3{font:600 18px 'Playfair Display',serif;margin:8px 0 5px;line-height:1.2}.saved-card span{display:block;color:#777a72;font-size:11px}.saved-card button{margin-top:14px;border:1px solid #d7d2c8;background:#fffdf8;color:#696c64;border-radius:999px;padding:7px 11px;font:600 10px 'DM Sans';cursor:pointer}.saved-card button:hover{background:#ece8df;color:#343830}.empty-saved{text-align:center;padding:60px 20px;color:#777a72}.empty-saved span{display:block;font-size:48px;color:#b8b1a5}.empty-saved h3{color:#343830;margin:12px 0 5px;font:600 22px 'Playfair Display',serif}.empty-saved p{font-size:12px}.surprise-modal .close{top:14px;right:14px}.surprise-modal h2{font:700 36px 'Playfair Display',serif}.surprise-modal .action-row{margin-top:22px}.surprise-modal .secondary{background:#fffdf8}.surprise-modal .favorite-action{background:#fffdf8}'''
          c += addition
          css.write_text(c)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/styles.css
          git commit -m 'fix: improve saved meals and surprise interactions' || true
          git push
          git rm .github/workflows/fix-saved-surprise.yml
          git commit -m 'chore: remove temporary fix workflow' || true
          git push
